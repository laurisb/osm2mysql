name: Release

# Build static binaries for every supported platform and attach them to the
# GitHub release when one is published (e.g. from a pushed tag like v1.0.0).
# `published` avoids building and uploading assets when a draft is created.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0" # fully static, distro-independent binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          bin=osm2mysql
          [ "$GOOS" = "windows" ] && bin=osm2mysql.exe

          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$bin" ./cmd/osm2mysql

          name="osm2mysql_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            archive="${name}.zip"
            zip "$archive" "$bin" README.md LICENSE.md
          else
            archive="${name}.tar.gz"
            tar czf "$archive" "$bin" README.md LICENSE.md
          fi
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            osm2mysql_*.tar.gz
            osm2mysql_*.zip
            osm2mysql_*.sha256
